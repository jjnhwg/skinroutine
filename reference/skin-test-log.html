<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Skin Test Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f6f6f7;
    --surface-3: #eeeef0;
    --border: #ececef;
    --border-strong: #d9d9de;
    --text: #1d1d1f;
    --text-muted: #6b6b73;
    --accent: #d4674f;
    --accent-hover: #c25a43;
    --accent-contrast: #ffffff;
    --accent-soft: #fdf0ec;
    --accent-ring: #f4c7bb;
    --focus: #2f6fd6;
    --r1: #34a36b; --r2: #8cc063; --r3: #f0c64a; --r4: #f0924f; --r5: #e2554a;
    --empty: #f0f0f2;
    --warn-bg: #fff8e6; --warn-text: #7a5300; --warn-border: #f5dfa0;
    --good: #23875a; --bad: #c43d30;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(20,20,30,.04), 0 6px 24px rgba(20,20,30,.06);
    --shadow-sm: 0 1px 2px rgba(20,20,30,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
  a { color: var(--accent); }

  header.top { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.88); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); }
  header.top .inner { max-width: 640px; margin: 0 auto; padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #f3a08c, #d4674f); display: grid; place-items: center; color: #fff; flex: none; }
  header.top h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; font-weight: 700; }
  header.top p { margin: 0; color: var(--text-muted); font-size: 13px; }

  main { max-width: 640px; margin: 0 auto; padding: 4px 16px 24px; }
  .page-title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 8px 0 2px; }
  .page-sub { color: var(--text-muted); font-size: 14px; margin: 0 0 8px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
  .card h2, .section-h { font-size: 15px; font-weight: 700; margin: 0 0 12px; letter-spacing: -.01em; }
  .section-h .count { color: var(--text-muted); font-weight: 500; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .card-head h2 { margin: 0; }
  .muted { color: var(--text-muted); font-size: 14px; }
  label.field { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--text); }
  input[type=text], input[type=date], textarea, select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2);
    border: 1px solid transparent; border-radius: 12px; padding: 12px 14px; transition: border-color .15s, background .15s;
  }
  input[type=text]:focus, input[type=date]:focus, textarea:focus, select:focus { outline: none; background: #fff; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  textarea { min-height: 88px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  button { font: inherit; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border-strong); background: #fff; color: var(--text); border-radius: 12px; padding: 11px 16px; font-weight: 600; font-size: 15px; min-height: 46px; text-decoration: none; transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); box-shadow: 0 4px 14px rgba(212,103,79,.28); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; border-radius: 10px; }
  .link-btn { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 2px; }

  /* date bar */
  .datebar { display: flex; align-items: center; gap: 8px; }
  .datebar .icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: #fff; display: grid; place-items: center; color: var(--text); }
  .datebar .icon-btn:disabled { opacity: .35; cursor: default; }
  .datebar .date-label { flex: 1; text-align: center; }
  .datebar .date-label strong { display: block; font-size: 17px; }
  .datebar .date-label input { width: auto; padding: 4px 8px; font-size: 13px; background: transparent; color: var(--text-muted); text-align: center; }

  /* product avatars & tiles */
  .avatar { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: var(--surface-3); flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 20px; }
  .avatar.xs { width: 26px; height: 26px; border-radius: 8px; font-size: 11px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .tile { position: relative; text-align: left; border: 1.5px solid var(--border); background: #fff; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 8px; color: var(--text); transition: border-color .15s, box-shadow .15s, opacity .15s; }
  .tile .img { aspect-ratio: 1; width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; font-size: 28px; font-weight: 700; color: #fff; }
  .tile .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .name { font-weight: 600; font-size: 13px; line-height: 1.3; }
  .tile .slot { font-size: 12px; color: var(--text-muted); }
  .tile .check { position: absolute; top: 13px; right: 13px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.95); border: 1.5px solid var(--border-strong); display: grid; place-items: center; color: transparent; box-shadow: var(--shadow-sm); }
  .tile[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tile[aria-pressed=true] .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tile[aria-pressed=false] .img { opacity: .55; filter: grayscale(.4); }
  .tile[aria-pressed=false] .name { color: var(--text-muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
  .chip.accent { background: var(--accent-soft); color: var(--accent-hover); }

  .ratings { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .rating { min-height: 72px; border-radius: 14px; border: 1.5px solid var(--border); background: #fff; color: var(--text); font-weight: 700; font-size: 17px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: border-color .15s, background .15s; }
  .rating small { font-weight: 500; font-size: 10.5px; white-space: nowrap; color: var(--text-muted); }
  .rating .dot { width: 14px; height: 14px; border-radius: 50%; }
  .rating[aria-pressed=true] { border-color: var(--rc); background: color-mix(in srgb, var(--rc) 12%, #fff); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rc) 20%, transparent); }
  .toggle { border-radius: 999px; border: 1.5px solid var(--border); background: #fff; color: var(--text); padding: 8px 16px; min-height: 40px; font-weight: 500; font-size: 14px; }
  .toggle[aria-pressed=true] { background: var(--text); color: #fff; border-color: var(--text); }

  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 10px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); padding: 0; border: none; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .remove { position: absolute; top: 5px; right: 5px; width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 1; display: grid; place-items: center; }
  .add-photo { aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed var(--border-strong); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; background: #fff; }
  .add-photo:hover { border-color: var(--accent); color: var(--accent); }
  .add-photo:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }

  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .strip .dow { font-size: 11px; color: var(--text-muted); text-align: center; font-weight: 600; }
  .day { aspect-ratio: 1; border-radius: 10px; border: 2px solid transparent; background: var(--empty); color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 0; }
  .day.filled { color: #1d1d1f; }
  .day.today { border-color: var(--text); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-top: 14px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; background: var(--c); vertical-align: -1px; }

  .history-item { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); }
  .history-item:first-child { border-top: none; padding-top: 0; }
  .history-item .bar { width: 6px; border-radius: 3px; flex: none; }
  .history-item .body { flex: 1; min-width: 0; }
  .history-item .date { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .history-item .date a { color: var(--text); text-decoration: none; }
  .history-item .date a:hover { text-decoration: underline; }
  .history-item.event .body { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .used { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }

  .warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 12px; line-height: 1.45; }
  .insight { font-size: 14px; margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; }
  .insight .good { color: var(--good); font-weight: 700; }
  .insight .bad { color: var(--bad); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 8px 6px; text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 11px; color: var(--text-muted); line-height: 1.2; display: block; }
  .product { padding: 16px 0; border-top: 1px solid var(--border); }
  .product:first-of-type { border-top: none; padding-top: 0; }
  .product .head { display: flex; gap: 12px; align-items: center; }
  .product h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .product .avatar-btn { position: relative; padding: 0; border: none; background: none; border-radius: 16px; }
  .product .avatar-btn .edit { position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1px solid var(--border-strong); display: grid; place-items: center; color: var(--text-muted); }

  .img-pick { display: flex; align-items: center; gap: 12px; }
  .img-pick .preview { width: 72px; height: 72px; border-radius: 16px; border: 1.5px dashed var(--border-strong); display: grid; place-items: center; overflow: hidden; color: var(--text-muted); background: var(--surface-2); flex: none; }
  .img-pick .preview img { width: 100%; height: 100%; object-fit: cover; }

  details.add { padding: 0; }
  details.add summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  details.add summary::-webkit-details-marker { display: none; }
  details.add summary .plus { width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  details.add[open] summary .plus { transform: rotate(45deg); }
  details.add .content { padding: 0 18px 18px; }

  .empty { text-align: center; padding: 26px 12px; color: var(--text-muted); font-size: 14px; }
  .empty .em-ic { width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .empty strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 15px; }

  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.94); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.tabs .inner { display: flex; max-width: 640px; margin: 0 auto; }
  nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 10px; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 600; }
  nav.tabs a svg { width: 24px; height: 24px; }
  nav.tabs a[aria-current=page] { color: var(--accent); }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .lightbox { position: fixed; inset: 0; background: rgba(15,15,20,.92); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }
  .lightbox .close, .lightbox .nav { position: absolute; background: rgba(255,255,255,.16); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 22px; display: grid; place-items: center; }
  .lightbox .close { top: 16px; right: 16px; }
  .lightbox .prev { left: 12px; top: 50%; }
  .lightbox .next { right: 12px; top: 50%; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .brand { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }

  /* catalog picker */
  .pick-btn { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; border-radius: 14px; border: 1.5px solid var(--border); background: linear-gradient(135deg, #fff, var(--accent-soft)); color: var(--text); }
  .pick-btn .stack { display: flex; }
  .pick-btn .stack img { width: 36px; height: 36px; border-radius: 10px; border: 2px solid #fff; margin-left: -10px; box-shadow: var(--shadow-sm); }
  .pick-btn .stack img:first-child { margin-left: 0; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 12px; margin: 16px 0 2px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(20,20,30,.35); z-index: 35; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 640px; height: 92vh; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.12); }
  .sheet-head { padding: 10px 16px 8px; border-bottom: 1px solid var(--border); }
  .sheet-head .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 0 auto 10px; }
  .sheet-head .title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  .sheet-head .close-x { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--surface-2); font-size: 18px; color: var(--text); }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .search input { padding-left: 38px !important; }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats .toggle { flex: none; min-height: 34px; padding: 6px 14px; font-size: 13px; }
  .sheet-body { overflow-y: auto; padding: 14px 16px 24px; flex: 1; }
  .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .cat-item { border: 1.5px solid var(--border); background: #fff; border-radius: 16px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 6px; color: var(--text); transition: border-color .15s, transform .1s; }
  .cat-item:hover { border-color: var(--accent); }
  .cat-item:active { transform: scale(.98); }
  .cat-item img { width: 100%; aspect-ratio: 1; border-radius: 12px; display: block; }
  .cat-item .n { font-size: 12.5px; font-weight: 600; line-height: 1.25; }
  .online { margin-top: 22px; padding: 14px; border-radius: 14px; background: var(--surface-2); text-align: center; font-size: 14px; }

  .save-bar { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); display: flex; gap: 10px; padding: 12px 0 4px; background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 30%); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c3.5 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.8 6-11z"/></svg>
    </div>
    <div>
      <h1>Skin Test Log</h1>
      <p>Track your routine, log your skin, see what helps.</p>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"></main>

<nav class="tabs" aria-label="Main">
  <div class="inner">
    <a href="#/log" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>Log</a>
    <a href="#/timeline" data-tab="timeline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Timeline</a>
    <a href="#/products" data-tab="products">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2h6v4H9z"/><path d="M8 6h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 12h12"/></svg>Products</a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- constants & copy ---------- */

  const a = hex.match(/\w\w/g).map(h => parseInt(h, 16)), b = other.match(/\w\w/g).map(h => parseInt(h, 16));
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, "0")).join("");
}

/* ---------- date helpers (plain YYYY-MM-DD strings only) ---------- */
function todayStr() {
  const d = new Date();
  return fmt(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
function fmt(y, m, d) { return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function addDays(s, n) {
  const [y, m, d] = s.split("-").map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + n));
  return fmt(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate());
}
function daysBetween(a, b) {
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
}
function prettyDate(s, opts = { weekday: "short", month: "short", day: "numeric" }) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString(undefined, { ...opts, timeZone: "UTC" });
}
function relativeDay(s) {
  const n = daysBetween(s, todayStr());
  if (n === 0) return "Today";
  if (n === 1) return "Yesterday";
  return prettyDate(s, { weekday: "long" });
}

/* ---------- domain logic ---------- */
function routineFor(date) {
  return state.products
    .filter(p => p.startedOn <= date && (!p.stoppedOn || p.stoppedOn >= date))
    .sort((a, b) => a.startedOn.localeCompare(b.startedOn));
}
/** Products actually used on a log. Older entries without a selection count as the full routine. */
function usedOn(log) {
  const routine = routineFor(log.logDate);
  if (!Array.isArray(log.usedProductIds)) return routine;
  return routine.filter(p => log.usedProductIds.includes(p.id));
}
const isRough = l => l.rating >= 4 || l.tags.includes("Pimple");
const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;

/** Pure: per-product insight numbers. */
function computeInsights(products, logs) {
  return products.map(p => {
    const end = p.stoppedOn || "9999-12-31";
    const since = logs.filter(l => l.logDate >= p.startedOn && l.logDate <= end);
    const beforeStart = addDays(p.startedOn, -14);
    const before = logs.filter(l => l.logDate >= beforeStart && l.logDate < p.startedOn);
    const overlaps = products.filter(o => o.id !== p.id && Math.abs(daysBetween(o.startedOn, p.startedOn)) <= 7);
    return {
      productId: p.id,
      entriesSinceStart: since.length,
      roughDays: since.filter(isRough).length,
      avgSinceStart: avg(since.map(l => l.rating)),
      avgBeforeStart: before.length >= 3 ? avg(before.map(l => l.rating)) : null,
      overlappingProductIds: overlaps.map(o => o.id),
    };
  });
}
function insightText(p, ins) {
  const MIN = 5;
  if (ins.entriesSinceStart === 0) return `No entries since you started ${esc(p.name)} yet.`;
  if (ins.entriesSinceStart < MIN) {
    const n = MIN - ins.entriesSinceStart;
    return `Keep logging — ${n} more ${n === 1 ? "entry" : "entries"} before a trend means much.`;
  }
  if (ins.avgBeforeStart === null) {
    return `Average ${ins.avgSinceStart.toFixed(1)} since starting. Not enough entries in the 2 weeks before to compare.`;
  }
  const diff = ins.avgSinceStart - ins.avgBeforeStart;
  const nums = `(${ins.avgBeforeStart.toFixed(1)} → ${ins.avgSinceStart.toFixed(1)})`;
  if (diff <= -0.5) return `<span class="good">Seems to help.</span> Skin has been calmer since starting ${esc(p.name)} ${nums}.`;
  if (diff >= 0.5) return `<span class="bad">Might be hurting.</span> Skin has been rougher since starting ${esc(p.name)} ${nums}.`;
  return `No clear change yet ${nums}.`;
}

async function resizeImage(file, max, square = false) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  if (square) {
    const side = Math.min(bmp.width, bmp.height);
    const out = Math.min(max, side);
    c.width = c.height = out;
    ctx.drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, out, out);
  } else {
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
  }
  bmp.close?.();
  return c.toDataURL("image/jpeg", 0.8);
}

    a.dataset.tab === tab ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));

    if (routine.length) q("#used-count").textContent = `${draft.used.length} of ${routine.length}`;
    const allBtn = q("#all");
    if (allBtn) allBtn.textContent = draft.used.length === routine.length ? "Clear all" : "Select all";
    app.querySelectorAll(".rating").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.r === draft.rating)));
    app.querySelectorAll(".toggle").forEach(b => b.setAttribute("aria-pressed", String(draft.tags.includes(b.dataset.tag))));
    q("#photos").innerHTML = draft.photos.map((ph, i) => `
      <div class="thumb">
        <button type="button" data-open="${i}" style="all:unset;display:block;width:100%;height:100%;cursor:zoom-in" aria-label="Enlarge photo ${i + 1}"><img src="${ph}" alt=""></button>
        <button type="button" class="remove" data-rm="${i}" aria-label="Remove photo ${i + 1}">×</button>
      </div>`).join("") + `
      <label class="add-photo">${ICON_CAMERA}Add photo<input type="file" id="file" accept="image/*" multiple class="sr-only"></label>`;
    q("#file").addEventListener("change", onFiles);
  }
  async function onFiles(e) {
    for (const f of e.target.files) {
      if (!f.type.startsWith("image/")) { toast("Only images can be added."); continue; }
      try { draft.photos.push(await resizeImage(f, 900)); } catch { toast("Couldn't read that image."); }
    }
    paint();
  }
  paint();

  q("#date").addEventListener("change", e => { if (e.target.value) location.hash = `#/log/${e.target.value}`; });
  q("#prev").addEventListener("click", () => location.hash = `#/log/${addDays(date, -1)}`);
  q("#next").addEventListener("click", () => location.hash = `#/log/${addDays(date, 1)}`);
  q("#all")?.addEventListener("click", () => {
    draft.used = draft.used.length === routine.length ? [] : routine.map(p => p.id); paint();
  });
  app.querySelectorAll(".tile").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.pid;
    draft.used = draft.used.includes(id) ? draft.used.filter(x => x !== id) : [...draft.used, id];
    paint();
  }));
  app.querySelectorAll(".rating").forEach(b => b.addEventListener("click", () => { draft.rating = +b.dataset.r; paint(); }));
  app.querySelectorAll(".toggle").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.tag;
    draft.tags = draft.tags.includes(t) ? draft.tags.filter(x => x !== t) : [...draft.tags, t];
    paint();
  }));
  q("#photos").addEventListener("click", e => {
    const rm = e.target.closest("[data-rm]"), op = e.target.closest("[data-open]");
    if (rm) { draft.photos.splice(+rm.dataset.rm, 1); paint(); }
    else if (op) openLightbox(draft.photos, +op.dataset.open);
  });
  q("#save").addEventListener("click", () => {
    if (!draft.rating) { toast("Pick a rating first."); return; }
    const rec = { id: existing?.id || uid(), logDate: date, rating: draft.rating, tags: draft.tags,
      note: q("#note").value.trim(), usedProductIds: draft.used, photos: draft.photos };
    const prev = state.logs;
    state.logs = [...state.logs.filter(l => l.logDate !== date), rec];
    if (!save()) { state.logs = prev; return; }
    toast(existing ? "Entry updated" : "Entry saved");
    route();
  });
  q("#del")?.addEventListener("click", () => {
    if (!confirm(`Delete the entry for ${prettyDate(date)}?`)) return;
    state.logs = state.logs.filter(l => l.logDate !== date); save();
    toast("Entry deleted"); route();
  });
}

/* ---------- Timeline screen ---------- */

  const events = [
    ...state.logs.map(l => ({ date: l.logDate, kind: "log", order: 2, l })),
    ...state.products.map(p => ({ date: p.startedOn, kind: "start", order: 1, p })),
    ...state.products.filter(p => p.stoppedOn).map(p => ({ date: p.stoppedOn, kind: "stop", order: 0, p })),

  const dow = d => prettyDate(d, { weekday: "narrow" });

    </div>
    <div class="card">

      ${events.length ? events.map(ev => {
        if (ev.kind === "log") {
          const l = ev.l, used = usedOn(l);
          return `<div class="history-item">

            <div class="body">
              <div class="date"><a href="#/log/${l.logDate}">${prettyDate(l.logDate)}</a> · ${l.rating} ${RATING_LABELS[l.rating]}</div>
              ${l.tags.length ? `<div class="chips" style="margin-top:6px">${l.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div>` : ""}
              ${l.note ? `<div style="margin-top:6px;font-size:15px">${esc(l.note)}</div>` : ""}
              ${used.length ? `<div class="used" aria-label="Used: ${esc(used.map(p => p.name).join(", "))}">${used.map(p => `<span title="${esc(p.name)}">${avatar(p, "xs")}</span>`).join("")}</div>` : ""}
              ${l.photos.length ? `<div class="photos">${l.photos.map((ph, i) => `<button type="button" class="thumb" data-log="${l.logDate}" data-i="${i}" aria-label="Enlarge photo ${i + 1} from ${prettyDate(l.logDate)}"><img src="${ph}" alt=""></button>`).join("")}</div>` : ""}

          <div><div class="date">${prettyDate(ev.date)}</div>
          <div style="font-size:14px">${ev.kind === "start" ? "Started" : "Stopped"} <b>${esc(ev.p.name)}</b></div></div></div></div>`;
      }).join("") : `<div class="empty"><div class="em-ic">${ICON_CAMERA}</div><strong>Nothing here yet</strong>Log your skin or add a product to start your history.<div style="margin-top:14px"><a class="btn primary" href="#/log">Log today</a></div></div>`}

  app.querySelectorAll(".day").forEach(b => b.addEventListener("click", () => location.hash = `#/log/${b.dataset.d}`));

      <form class="content" id="add">
        <button type="button" class="pick-btn" id="open-catalog">
          <span class="stack" aria-hidden="true">${[9, 0, 20, 24].map(i => `<img src="${productArt(CATALOG[i])}" alt="">`).join("")}</span>
          <span class="grow"><b style="display:block;font-size:15px">Choose from popular products</b><span class="muted" style="font-size:13px">${CATALOG.length}+ products, or search online</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="or">or type your own</div>
        <div class="img-pick" style="margin-top:12px">
          <label class="preview" id="pimg-preview" style="cursor:pointer">${newProductImage ? `<img src="${newProductImage}" alt="">` : ICON_CAMERA}

          <div class="muted" style="font-size:13px">Add a photo of the bottle so it's easy to spot in your routine. <span id="pimg-clear-wrap" ${newProductImage ? "" : "hidden"}><button type="button" class="link-btn" id="pimg-clear">Remove</button></span></div>
        </div>

    <p class="page-sub">Back up your log so you never lose it.</p>
    <div class="card">
      <h2>Backup</h2>
      <div class="warn" style="margin-top:0">Your log lives only in this browser. Clearing browser data or switching phones deletes everything unless you've exported a backup.</div>
      <div class="stats" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><b>${state.products.length}</b><span>products</span></div>
        <div class="stat"><b>${state.logs.length}</b><span>entries</span></div>
        <div class="stat"><b>${photoCount}</b><span>photos</span></div>
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary grow" id="export">Export backup</button>
        <label class="btn grow">Import backup<input type="file" id="import" accept="application/json,.json" class="sr-only"></label>
      </div>
    </div>`;
  app.querySelector("#export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "skin-test-log", version: 1, exportedAt: new Date().toISOString(), ...state })], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `skin-test-log-${todayStr()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  app.querySelector("#import").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { toast("That file isn't valid JSON."); return; }
    if (data?.app !== "skin-test-log" || !Array.isArray(data.products) || !Array.isArray(data.logs)) { toast("That doesn't look like a Skin Test Log backup."); return; }
    const replace = confirm(`Backup has ${data.products.length} products and ${data.logs.length} entries.\n\nOK = replace everything here\nCancel = merge (backup wins on the same day)`);
    if (replace) state = { products: data.products, logs: data.logs };
    else {
      const ids = new Set(data.products.map(p => p.id));
      const dates = new Set(data.logs.map(l => l.logDate));
      state = { products: [...state.products.filter(p => !ids.has(p.id)), ...data.products],
                logs: [...state.logs.filter(l => !dates.has(l.logDate)), ...data.logs] };
    }
    save(); toast("Backup imported"); route();
  });
}

/* ---------- Catalog picker sheet ---------- */
function openCatalog(onPick) {
  const opener = document.activeElement;
  let cat = "All", term = "", online = null, onlineState = "idle";
  const wrap = document.createElement("div");
  wrap.className = "sheet-backdrop";
  wrap.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <div class="grab" aria-hidden="true"></div>
        <div class="title-row"><h2 id="sheet-title">Choose a product</h2><button type="button" class="close-x" aria-label="Close">×</button></div>
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="cat-search">Search products</label>
          <input type="text" id="cat-search" placeholder="Search brand or product" autocomplete="off">
        </div>
        <div class="cats" role="group" aria-label="Category">
          ${["All", ...CATEGORIES].map(c => `<button type="button" class="toggle" data-cat="${c}" aria-pressed="${c === "All"}">${c}</button>`).join("")}
        </div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>`;
  const body = wrap.querySelector("#sheet-body");
  const itemHtml = (it, key) => `<button type="button" class="cat-item" data-key="${key}">
      <img src="${productArt(it)}" alt="">
      <span><span class="brand">${esc(it.brand)}</span><br><span class="n">${esc(it.name)}</span></span></button>`;

  function paint() {
    const t = term.toLowerCase();
    const list = CATALOG.filter(it => (cat === "All" || it.category === cat) && (!t || `${it.brand} ${it.name}`.toLowerCase().includes(t)));
    let html = list.length
      ? `<div class="catalog">${list.map(it => itemHtml(it, it.id)).join("")}</div>`
      : `<div class="empty" style="padding-top:8px"><strong>No match in the list</strong>Try searching online below.</div>`;
    if (onlineState === "loading") html += `<div class="online">Searching online…</div>`;
    else if (onlineState === "error") html += `<div class="online">Couldn't reach the online database. Check your connection and try again.</div>`;
    else if (onlineState === "done") {
      html += `<h3 class="section-h" style="margin:22px 0 10px">From Open Beauty Facts</h3>` + (online.length
        ? `<div class="catalog">${online.map((it, i) => itemHtml(it, `o${i}`)).join("")}</div>`
        : `<div class="online">Nothing found online either. Close this and type it in yourself.</div>`);
    }
    if (onlineState !== "loading" && onlineState !== "done") {
      html += `<div class="online">Can't find it?<br><button type="button" class="btn small" id="search-online" style="margin-top:8px" ${term.trim().length < 2 ? "disabled" : ""}>Search ${term.trim() ? `“${esc(term.trim())}”` : ""} online</button>
        <div class="muted" style="font-size:12px;margin-top:6px">${term.trim().length < 2 ? "Type a name above first." : "Uses the free Open Beauty Facts database."}</div></div>`;
    }
    body.innerHTML = html;
    wrap.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === cat)));
  }

  async function searchOnline() {
    onlineState = "loading"; paint();
    try {
      const url = `https://world.openbeautyfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term.trim())}&search_simple=1&action=process&json=1&page_size=24&fields=product_name,brands`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const seen = new Set();
      online = data.products
        .filter(p => p.product_name)
        .map(p => ({ brand: (p.brands || "").split(",")[0].trim(), name: p.product_name.trim() }))
        .filter(p => { const k = `${p.brand}|${p.name}`.toLowerCase(); return seen.has(k) ? false : seen.add(k); })
        .slice(0, 18)
        .map((p, i) => {
          const [category, shape] = guessKind(p.name);
          return { ...p, category, shape, slot: category === "Sunscreen" ? "AM" : "BOTH",
            color: PASTELS[(p.brand.length + p.name.length + i) % PASTELS.length],
            label: (p.brand || p.name).split(/\s+/)[0].slice(0, 8).toUpperCase() };
        });
      onlineState = "done";
    } catch { onlineState = "error"; }
    paint();
  }

  const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); opener?.focus?.(); };
  function onKey(e) {
    if (e.key === "Escape") close();
    else if (e.key === "Tab") {
      const f = [...wrap.querySelectorAll("button:not([disabled]), input")];
      const idx = f.indexOf(document.activeElement);
      e.preventDefault(); f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  }
  wrap.addEventListener("click", e => {
    if (e.target === wrap || e.target.closest(".close-x")) return close();
    const c = e.target.closest("[data-cat]"); if (c) { cat = c.dataset.cat; return paint(); }
    if (e.target.closest("#search-online")) return searchOnline();
    const it = e.target.closest("[data-key]");
    if (it) {
      const k = it.dataset.key;
      const item = k.startsWith("o") ? online[+k.slice(1)] : CATALOG.find(x => x.id === k);
      close(); onPick(item);
    }
  });
  const input = wrap.querySelector("#cat-search");
  input.addEventListener("input", () => { term = input.value; if (onlineState !== "loading") onlineState = "idle"; paint(); });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && term.trim().length >= 2) searchOnline(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(wrap); paint(); input.focus();
}

/* ---------- Lightbox ---------- */
function openLightbox(photos, index) {
  const opener = document.activeElement;
  let i = index;
  const box = document.createElement("div");
  box.className = "lightbox"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-label", "Photo viewer");
  const paint = () => {
    box.innerHTML = `<img src="${photos[i]}" alt="Photo ${i + 1} of ${photos.length}">
      <button class="close" aria-label="Close">×</button>
      ${photos.length > 1 ? `<button class="nav prev" aria-label="Previous photo">‹</button><button class="nav next" aria-label="Next photo">›</button>` : ""}`;
    box.querySelector(".close").focus();
  };
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); opener?.focus?.(); };
  const step = d => { i = (i + d + photos.length) % photos.length; paint(); };
  function onKey(e) {
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "Tab") {
      const f = [...box.querySelectorAll("button")];
      const idx = f.indexOf(document.activeElement);
      e.preventDefault(); f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  }
  box.addEventListener("click", e => {
    if (e.target === box || e.target.closest(".close")) close();
    else if (e.target.closest(".prev")) step(-1);
    else if (e.target.closest(".next")) step(1);
  });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(box); paint();
}

route();
</script>
